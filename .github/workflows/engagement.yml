name: Collect engagement

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engagement
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Fetch engagement
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python fetch_engagement.py

      - name: Commit the numbers
        run: |
          if [[ -n "$(git status --porcelain posts/engagement.json)" ]]; then
            git config user.name  "racquet-point-bot"
            git config user.email "actions@github.com"
            git add posts/engagement.json
            git commit -m "Engagement update $(date -u +%FT%RZ)"
            git pull --rebase
            git push
          else
            echo "No change."
          fi
